name: Desktop Ensure GitHub Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  workflow_run:
    workflows:
      - Desktop Auto Version And Tag
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  create-or-update-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download release tag artifact
        uses: actions/download-artifact@v8
        with:
          name: release-tag
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag
        id: resolve-tag
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f release-tag.txt ]; then
            echo "release-tag artifact not found"
            exit 1
          fi

          TAG=$(tr -d '\r\n' < release-tag.txt)
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Resolved tag is invalid: $TAG"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or update GitHub release
        uses: actions/github-script@v8
        with:
          script: |
            const tag = `${{ steps.resolve-tag.outputs.tag }}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let existingRelease = null;
            try {
              const response = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              existingRelease = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existingRelease) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existingRelease.id,
                tag_name: tag,
                name: `MCFunction++ ${tag}`,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              });
              core.info(`Updated existing release for ${tag}`);
            } else {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `MCFunction++ ${tag}`,
                draft: false,
                prerelease: false,
                generate_release_notes: true,
                make_latest: 'true',
              });
              core.info(`Created release for ${tag}`);
            }

      - name: Summary
        run: |
          echo "Release ensured for ${{ steps.resolve-tag.outputs.tag }}"
          echo "Desktop Build And Publish NSIS Installer publishes installer assets to that release."
