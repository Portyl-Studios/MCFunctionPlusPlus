name: Desktop Ensure GitHub Release

on:
  workflow_run:
    workflows:
      - Desktop Auto Version And Tag
    types:
      - completed

permissions:
  contents: write

jobs:
  create-or-update-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release tag from main HEAD
        id: resolve-tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags

          TAG=$(git tag --points-at HEAD --list 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$TAG" ]; then
            echo "No vX.Y.Z tag found on main HEAD; skipping release creation"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Create or update GitHub release
        if: steps.resolve-tag.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `${{ steps.resolve-tag.outputs.tag }}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let existingRelease = null;
            try {
              const response = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              existingRelease = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existingRelease) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existingRelease.id,
                tag_name: tag,
                name: `MCFunction++ ${tag}`,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              });
              core.info(`Updated existing release for ${tag}`);
            } else {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `MCFunction++ ${tag}`,
                draft: false,
                prerelease: false,
                generate_release_notes: true,
                make_latest: 'true',
              });
              core.info(`Created release for ${tag}`);
            }

      - name: Summary
        if: steps.resolve-tag.outputs.skip != 'true'
        run: |
          echo "Release ensured for ${{ steps.resolve-tag.outputs.tag }}"
          echo "Desktop Build And Publish NSIS Installer publishes installer assets to that release."
