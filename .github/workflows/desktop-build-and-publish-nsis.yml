name: Desktop Build And Publish NSIS Installer

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  actions: read
  contents: write

jobs:
  build-and-publish-nsis:
    if: ${{ github.event_name == 'push' }}
    runs-on: windows-latest

    steps:
      - name: Resolve target tag
        id: resolve-tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF#refs/tags/}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Resolved tag is invalid: $TAG"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "ref=refs/tags/$TAG" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve-tag.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Check existing release assets
        id: release-assets
        uses: actions/github-script@v8
        with:
          script: |
            const tag = `${{ steps.resolve-tag.outputs.tag }}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const response = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              const assetNames = response.data.assets.map((asset) => asset.name);
              const hasInstaller = assetNames.some((name) => / Installer\.exe$/i.test(name));
              const hasLatestYml = assetNames.includes('latest.yml');

              core.info(`Existing assets for ${tag}: ${assetNames.join(', ') || '(none)'}`);
              core.setOutput('should_publish', hasInstaller && hasLatestYml ? 'false' : 'true');
            } catch (error) {
              if (error.status === 404) {
                core.info(`No release exists yet for ${tag}; publishing is required.`);
                core.setOutput('should_publish', 'true');
                return;
              }
              throw error;
            }

      - name: Setup Node.js
        if: steps.release-assets.outputs.should_publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.release-assets.outputs.should_publish == 'true'
        run: npm ci

      - name: Build app
        if: steps.release-assets.outputs.should_publish == 'true'
        run: npm run build

      - name: Build and publish NSIS release
        if: steps.release-assets.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish always

      - name: Summary
        if: steps.release-assets.outputs.should_publish != 'true'
        run: echo "Installer assets already exist for ${{ steps.resolve-tag.outputs.tag }}; skipping duplicate publish."
