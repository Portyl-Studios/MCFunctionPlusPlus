name: Desktop Build And Publish NSIS Installer

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_run:
    workflows:
      - Desktop Auto Version And Tag
    types:
      - completed

permissions:
  contents: write

jobs:
  build-and-publish-nsis:
    if: ${{ github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: windows-latest

    steps:
      - name: Resolve checkout ref
        id: resolve-ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${GITHUB_REF}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-ref.outputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve target tag
        id: resolve-tag
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(git tag --points-at HEAD --list 'v*.*.*' | sort -V | tail -n1)
          fi

          if [ -z "$TAG" ]; then
            echo "No vX.Y.Z tag found for this run; skipping publish"
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Check existing release assets
        if: steps.resolve-tag.outputs.skip != 'true'
        id: release-assets
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `${{ steps.resolve-tag.outputs.tag }}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              const response = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              const assetNames = response.data.assets.map((asset) => asset.name);
              const hasInstaller = assetNames.some((name) => / Installer\.exe$/i.test(name));
              const hasLatestYml = assetNames.includes('latest.yml');

              core.info(`Existing assets for ${tag}: ${assetNames.join(', ') || '(none)'}`);
              core.setOutput('should_publish', hasInstaller && hasLatestYml ? 'false' : 'true');
            } catch (error) {
              if (error.status === 404) {
                core.info(`No release exists yet for ${tag}; publishing is required.`);
                core.setOutput('should_publish', 'true');
                return;
              }
              throw error;
            }

      - name: Setup Node.js
        if: steps.resolve-tag.outputs.skip != 'true' && steps.release-assets.outputs.should_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.resolve-tag.outputs.skip != 'true' && steps.release-assets.outputs.should_publish == 'true'
        run: npm ci

      - name: Build app
        if: steps.resolve-tag.outputs.skip != 'true' && steps.release-assets.outputs.should_publish == 'true'
        run: npm run build

      - name: Build and publish NSIS release
        if: steps.resolve-tag.outputs.skip != 'true' && steps.release-assets.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish always

      - name: Summary
        if: steps.resolve-tag.outputs.skip != 'true' && steps.release-assets.outputs.should_publish != 'true'
        run: echo "Installer assets already exist for ${{ steps.resolve-tag.outputs.tag }}; skipping duplicate publish."
