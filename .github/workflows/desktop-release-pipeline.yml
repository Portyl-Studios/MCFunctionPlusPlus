name: Desktop Release Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: desktop-release-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Gate the release on a green unit-test run. Pinned to windows-2022 to match
    # the release environment (the app is Windows-only and some tests exercise
    # Windows path behavior). [skip ci] commits never trigger this workflow, so
    # the bot's version-bump commit does not run this job.
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  release:
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' }}
    # Pinned to windows-2022. The electron-builder step runs @electron/rebuild,
    # which compiles the native @parcel/watcher module against the Electron ABI
    # and therefore needs the Visual Studio C++ toolchain. GitHub's windows-latest
    # image moved to Windows Server 2025, where node-gyp can no longer locate that
    # toolchain ("Could not find any Visual Studio installation to use"). windows-2022
    # ships VS 2022 with the C++ workload that node-gyp detects.
    runs-on: windows-2022
    permissions:
      actions: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve next version
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(node -p "require('./package.json').version")

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must use MAJOR.MINOR.PATCH"
            exit 1
          fi

          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)

          NEXT_PATCH=$(git tag --list "v${MAJOR}.${MINOR}.*" | node -e "const fs=require('fs');const tags=fs.readFileSync(0,'utf8').trim().split(/\\r?\\n/).filter(Boolean);let max=-1;for(const tag of tags){const m=tag.match(/^v\\d+\\.\\d+\\.(\\d+)$/);if(m)max=Math.max(max,Number(m[1]));}process.stdout.write(String(max+1));")
          TARGET_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          TARGET_TAG="v${TARGET_VERSION}"

          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "version=$TARGET_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TARGET_TAG" >> $GITHUB_OUTPUT

          if [ "$CURRENT_VERSION" = "$TARGET_VERSION" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            npm version "$TARGET_VERSION" --no-git-tag-version
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push version bump
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }} [skip ci]"
          git push origin main

      - name: Create and push tag
        id: release-tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.bump.outputs.tag }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi

          git tag "$TAG"
          git push origin "$TAG"

      - name: Ensure GitHub release exists
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const tag = `${{ steps.release-tag.outputs.tag }}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let existingRelease = null;
            try {
              const response = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              existingRelease = response.data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existingRelease) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: existingRelease.id,
                tag_name: tag,
                name: `MCFunction++ ${tag}`,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              });
              core.info(`Updated existing release for ${tag}`);
            } else {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `MCFunction++ ${tag}`,
                draft: false,
                prerelease: false,
                generate_release_notes: true,
                make_latest: 'true',
              });
              core.info(`Created release for ${tag}`);
            }

      - name: Validate tag version matches package version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.release-tag.outputs.tag }}"
          TAG_VERSION="${TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag/version mismatch detected"
            echo "Tag: $TAG"
            echo "package.json version: $PACKAGE_VERSION"
            exit 1
          fi

      - name: Check existing release assets
        id: release-assets
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const tag = `${{ steps.release-tag.outputs.tag }}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const normalizedVersion = tag.replace(/^v/i, '');

            try {
              const response = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              const assetNames = response.data.assets.map((asset) => asset.name);
              const hasInstaller = assetNames.some((name) => name.toLowerCase() === `mcfunctionplusplus-setup-${normalizedVersion}.exe`);
              const hasBlockmap = assetNames.some((name) => name.toLowerCase() === `mcfunctionplusplus-setup-${normalizedVersion}.exe.blockmap`);
              const hasLatestYml = assetNames.some((name) => name.toLowerCase() === 'latest.yml');

              core.info(`Existing assets for ${tag}: ${assetNames.join(', ') || '(none)'}`);
              core.setOutput('should_publish', hasInstaller && hasBlockmap && hasLatestYml ? 'false' : 'true');
            } catch (error) {
              if (error.status === 404) {
                core.info(`No release exists yet for ${tag}; publishing is required.`);
                core.setOutput('should_publish', 'true');
                return;
              }
              throw error;
            }

      - name: Build app
        if: steps.release-assets.outputs.should_publish == 'true'
        run: npm run build

      # Build only -- do NOT let electron-builder publish. With --publish always it
      # stages artifacts into its own draft release and then fails to finalize it,
      # because the workflow-owned published release already claims this tag. That
      # split leaves the installer + latest.yml stranded in a draft. Instead we
      # build here and attach the artifacts to the workflow's release below.
      - name: Build NSIS installer
        if: steps.release-assets.outputs.should_publish == 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never

      # Attach the installer, its blockmap, and the auto-update feed (latest.yml)
      # to the single release the workflow created. Explicit paths (not globs) so a
      # missing latest.yml fails the run loudly rather than shipping an installer
      # with no update metadata. --clobber makes re-runs idempotent.
      - name: Upload installer assets to release
        if: steps.release-assets.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          # NSIS artifactName is "${name}-setup-${version}.${ext}" (lowercase package name)
          gh release upload "${{ steps.release-tag.outputs.tag }}" \
            "release/mcfunctionplusplus-setup-${VERSION}.exe" \
            "release/mcfunctionplusplus-setup-${VERSION}.exe.blockmap" \
            "release/latest.yml" \
            --clobber

      - name: Summary
        if: steps.release-assets.outputs.should_publish != 'true'
        run: echo "Installer assets already exist for ${{ steps.release-tag.outputs.tag }}; skipping duplicate publish."