name: Desktop Enforce Version Policy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prevent-manual-patch-bumps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate package version policy
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "First push detected, skipping guard"
            exit 0
          fi

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "Base commit not found locally, fetching more history"
            git fetch --unshallow || true
            git fetch --tags || true
          fi

          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^package.json$'; then
            echo "package.json version unchanged in this range"
            exit 0
          fi

          BASE_VERSION=$(git show "$BASE_SHA:package.json" | node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(p.version);")
          HEAD_VERSION=$(git show "$HEAD_SHA:package.json" | node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync(0,'utf8'));process.stdout.write(p.version);")

          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid base version format: $BASE_VERSION"
            exit 1
          fi

          if [[ ! "$HEAD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid head version format: $HEAD_VERSION"
            exit 1
          fi

          BASE_MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          BASE_MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
          BASE_PATCH=$(echo "$BASE_VERSION" | cut -d. -f3)

          HEAD_MAJOR=$(echo "$HEAD_VERSION" | cut -d. -f1)
          HEAD_MINOR=$(echo "$HEAD_VERSION" | cut -d. -f2)
          HEAD_PATCH=$(echo "$HEAD_VERSION" | cut -d. -f3)

          if [ "$BASE_MAJOR" = "$HEAD_MAJOR" ] && [ "$BASE_MINOR" = "$HEAD_MINOR" ]; then
            if [ "$BASE_PATCH" != "$HEAD_PATCH" ]; then
              echo "Manual patch bumps are not allowed. Keep patch unchanged; the release workflow manages patch increments."
              echo "Base: $BASE_VERSION"
              echo "Head: $HEAD_VERSION"
              exit 1
            fi
            echo "Version policy OK: major/minor unchanged and patch unchanged"
            exit 0
          fi

          if [ "$HEAD_PATCH" != "0" ]; then
            echo "When changing major/minor manually, patch must be 0."
            echo "Head: $HEAD_VERSION"
            exit 1
          fi

          echo "Version policy OK: major/minor changed and patch reset to 0"
