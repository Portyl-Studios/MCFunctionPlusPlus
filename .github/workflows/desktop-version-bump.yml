name: Desktop Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve next version
        id: bump
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must use MAJOR.MINOR.PATCH"
            exit 1
          fi

          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)

          NEXT_PATCH=$(git tag --list "v${MAJOR}.${MINOR}.*" | node -e "const fs=require('fs');const tags=fs.readFileSync(0,'utf8').trim().split(/\\r?\\n/).filter(Boolean);let max=-1;for(const tag of tags){const m=tag.match(/^v\\d+\\.\\d+\\.(\\d+)$/);if(m)max=Math.max(max,Number(m[1]));}process.stdout.write(String(max+1));")
          TARGET_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"

          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "version=$TARGET_VERSION" >> $GITHUB_OUTPUT

          if [ "$CURRENT_VERSION" = "$TARGET_VERSION" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            npm version "$TARGET_VERSION" --no-git-tag-version
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push version bump
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git push origin main

      - name: Create and push tag
        run: |
          TAG="v${{ steps.bump.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi

          git tag "$TAG"
          git push origin "v${{ steps.bump.outputs.version }}"
